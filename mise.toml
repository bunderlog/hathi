[tools]
actionlint = "1.7.12"
"github:bunderlog/hathi" = "1.1.0"
gitleaks = "8.30.1"
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.20.0"
shellcheck = "0.11.0"
zizmor = "1.32.0"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = ["golangci-lint run", "actionlint", "zizmor --offline --no-progress ."]

[tasks.check]
depends = ["lint", "test"]
