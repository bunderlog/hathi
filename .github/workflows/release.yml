name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # mise installs the Release a project pins, and it prints its version (PRD, criterion 11).
  install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir project && cd project
          printf '[tools]\n"github:bunderlog/hathi" = "%s"\n' "$version" > mise.toml
          mise trust && mise install
          test "$(mise exec -- hathi version)" = "$version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
